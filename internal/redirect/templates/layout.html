{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} | {{.SiteName}}</title>
<link rel="icon" href="/images/favicon-32x32.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F3EEE4;color:#111111;min-height:100vh;display:flex;flex-direction:column}
header{padding:1rem 1.5rem}header a{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;color:inherit;text-decoration:none;font-size:1.25rem}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#FAF7F1;border:1px solid #DCD4C4;border-radius:.75rem;padding:2rem;max-width:32rem;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#5F5A50;line-height:1.5;margin:.25rem 0 1rem}
label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.35rem}
input{width:100%;padding:.6rem .75rem;border:1px solid #D2C9B8;border-radius:.5rem;font-size:1rem;background:#FFFDF9}
button{margin-top:1rem;width:100%;padding:.65rem;border:0;border-radius:.5rem;background:#1C2B8F;color:#F3EEE4;font-size:1rem;font-weight:500;cursor:pointer}
button:disabled{opacity:.6}.error{color:#D92A12;font-size:.875rem;margin-top:.75rem}.success{color:#16a34a}
a.back{color:#1C2B8F;font-weight:500}code{word-break:break-all;background:#E9E3D7;padding:.15rem .35rem;border-radius:.25rem}
@media (prefers-color-scheme:dark){body{background:#111218;color:#F3EEE4}.card{background:#1A1B24;border-color:#2C2E3B}p{color:#A8A296}input{background:#111218;color:#F3EEE4;border-color:#3A3C4B}button{background:#8F9CF2;color:#111218}.error{color:#FF5A40}a.back{color:#8F9CF2}code{background:#252734}}
</style>
<link rel="stylesheet" href="/css/custom.css" onerror="this.remove()">
</head>
<body>
<header><a href="/"><img src="/images/logo.png" alt="" width="24" height="24" onerror="this.remove()">{{.SiteName}}</a></header>
<main><div class="card">
{{end}}
{{define "foot"}}</div></main>
</body>
</html>
{{end}}
