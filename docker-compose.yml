# Tusk — single binary with SQLite.
# Volumes: /var/lib/tusk (database), /tusk/custom (UI overrides). Port 3000.
#
#   docker compose up -d
services:
  server:
    # Prebuilt multi-arch image. Pin a version with TUSK_IMAGE=ghcr.io/0mr4n/tusk:0.3.1,
    # or use a local build: `make docker` then TUSK_IMAGE=tusk:dev.
    image: ${TUSK_IMAGE:-ghcr.io/0mr4n/tusk:latest}
    restart: unless-stopped
    volumes:
      - db_data_sqlite:/var/lib/tusk
      - custom:/tusk/custom
    environment:
      DB_FILENAME: "/var/lib/tusk/data.sqlite"
      # JWT_SECRET signs sessions; keep it stable across restarts.
      JWT_SECRET: ${JWT_SECRET:-}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:3000}
      SITE_NAME: ${SITE_NAME:-Tusk}
    env_file:
      - path: .env
        required: false
    ports:
      - "3000"
volumes:
  db_data_sqlite:
  custom:
